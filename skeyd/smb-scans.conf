# Samba share for scanned documents, dropped in /etc/samba/smb.conf.d/ or
# appended to smb.conf.
#
# SMB is the one protocol reachable natively from every device on a home LAN:
# iPhone/iPad (Files -> Connect to Server), Windows Explorer, macOS Finder and
# Linux. NFS would exclude the phones, which is the main thing this is for.

[global]
   workgroup = WORKGROUP
   server string = Raspberry Pi scanner
   security = user
   map to guest = Bad User
   # The Pi 1 is a single-core ARMv6; keep Samba lean.
   server min protocol = SMB2
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   # Advertise over Bonjour/mDNS so the share appears in Finder and can be
   # reached as raspberrypi.local from iOS without typing an IP.
   multicast dns register = yes
   disable netbios = yes

[Scans]
   comment = Scanned documents
   path = /srv/scans
   browseable = yes
   read only = no
   guest ok = yes
   force user = vanaarde
   force group = scanner
   create mask = 0664
   directory mask = 0775
